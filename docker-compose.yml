# Twitch Chat Bot - Docker Compose Configuration
# Usage: docker-compose up -d

version: '3.8'

services:
  # Main bot application
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-bot
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - DASHBOARD_PORT=3001
      # Twitch Configuration (set in .env or environment)
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_ACCESS_TOKEN=${TWITCH_ACCESS_TOKEN}
      - TWITCH_REFRESH_TOKEN=${TWITCH_REFRESH_TOKEN}
      - TWITCH_SCOPES=${TWITCH_SCOPES}
      - TWITCH_BROADCASTER_NAME=${TWITCH_BROADCASTER_NAME}
      - TWITCH_CHANNELS=${TWITCH_CHANNELS}
      # Optional broadcaster tokens
      - TWITCH_BROADCASTER_ACCESS_TOKEN=${TWITCH_BROADCASTER_ACCESS_TOKEN:-}
      - TWITCH_BROADCASTER_REFRESH_TOKEN=${TWITCH_BROADCASTER_REFRESH_TOKEN:-}
      - TWITCH_BROADCASTER_SCOPES=${TWITCH_BROADCASTER_SCOPES:-}
      # Discord integration
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      # Feature flags
      - DISABLE_EVENTSUB=${DISABLE_EVENTSUB:-false}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Persist data
      - bot_data:/app/dashboard/logs
      - bot_uploads:/app/dashboard/uploads
      # Mount .env for token refresh (optional)
      - ./.env:/app/.env:rw
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  # Token generator service (run separately when needed)
  token-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-token-generator
    profiles:
      - tools
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./.env:/app/.env:rw
      - ./accounts.encrypted.json:/app/accounts.encrypted.json:rw
      - ./.encryption-key:/app/.encryption-key:rw
    command: ["node", "token-generator.js"]
    networks:
      - bot_network

volumes:
  bot_data:
    name: twitch_bot_data
  bot_uploads:
    name: twitch_bot_uploads

networks:
  bot_network:
    name: twitch_bot_network
    driver: bridge
