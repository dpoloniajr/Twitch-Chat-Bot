<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Box Overlay - OBS</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    #chat-messages {
      max-height: 100%;
    }

    .chat-message.fadeInUp {
      animation: fadeInUp 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div class="chat-container">
      <div class="chat-messages" id="chat-messages"></div>
    </div>
  </div>

  <script src="../js/overlay-client.js"></script>
  <script src="chat-box.js"></script>
</body>
</html>
