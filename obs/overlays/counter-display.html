<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter Display - OBS Overlay</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    :root {
      --counter-bg: rgba(0, 0, 0, 0.7);
      --counter-text: #ffffff;
      --counter-label: #aaaaaa;
      --counter-accent: #9146ff;
      --counter-positive: #00ff00;
      --counter-negative: #ff4444;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: transparent;
    }

    .counter-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 300px;
    }

    .counter-item {
      background: var(--counter-bg);
      border-radius: 10px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 4px solid var(--counter-accent);
      transition: all 0.3s ease;
    }

    .counter-item.highlight {
      transform: scale(1.05);
      border-left-color: var(--counter-positive);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    .counter-item.highlight.decrease {
      border-left-color: var(--counter-negative);
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
    }

    .counter-label {
      font-size: 16px;
      color: var(--counter-label);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .counter-value {
      font-size: 32px;
      font-weight: bold;
      color: var(--counter-text);
      font-variant-numeric: tabular-nums;
    }

    .counter-change {
      position: absolute;
      right: 70px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .counter-item.highlight .counter-change {
      opacity: 1;
    }

    .counter-change.positive {
      color: var(--counter-positive);
    }

    .counter-change.negative {
      color: var(--counter-negative);
    }

    /* Score display variant */
    .score-container {
      background: var(--counter-bg);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .score-title {
      font-size: 14px;
      color: var(--counter-label);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .score-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .score-wins, .score-losses {
      font-size: 36px;
      font-weight: bold;
    }

    .score-wins {
      color: var(--counter-positive);
    }

    .score-losses {
      color: var(--counter-negative);
    }

    .score-separator {
      font-size: 24px;
      color: var(--counter-label);
    }

    .score-winrate {
      font-size: 14px;
      color: var(--counter-label);
      margin-top: 5px;
    }

    /* Hidden state */
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Single counter display -->
  <div id="single-counter" class="counter-container hidden">
    <div class="counter-item" id="main-counter">
      <span class="counter-label" id="counter-label">Deaths</span>
      <span class="counter-value" id="counter-value">0</span>
    </div>
  </div>

  <!-- Multi-counter display -->
  <div id="multi-counter" class="counter-container hidden">
    <!-- Counters will be dynamically added here -->
  </div>

  <!-- Score (win/loss) display -->
  <div id="score-display" class="score-container hidden">
    <div class="score-title">Record</div>
    <div class="score-display">
      <span class="score-wins" id="wins-value">0</span>
      <span class="score-separator">-</span>
      <span class="score-losses" id="losses-value">0</span>
    </div>
    <div class="score-winrate" id="winrate-value">0% Win Rate</div>
  </div>

  <script src="../js/overlay-client.js"></script>
  <script src="counter-display.js"></script>
</body>
</html>
