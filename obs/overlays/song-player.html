<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Request Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    /* ─── Reset & base ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* ─── Houdini custom property for rotating border ──────────────────────────── */
    @property --border-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    /* ─── Theme variables ──────────────────────────────────────────────────────── */
    :root {
      --accent:         #9147ff;
      --accent-glow:    rgba(145, 71, 255, 0.6);
      --accent-glow2:   rgba(145, 71, 255, 0.2);
      --accent-light:   #c084fc;
      --accent-dark:    #6320d4;
      --accent-dim:     rgba(145, 71, 255, 0.15);
      --card-bg:        rgba(8, 6, 18, 0.94);
      --text-primary:   #ffffff;
      --text-secondary: rgba(200, 185, 255, 0.7);
      --border-base:    rgba(145, 71, 255, 0.5);
      --progress-track: rgba(255, 255, 255, 0.1);
      --scan-color:     rgba(145, 71, 255, 0.06);
      --cut-size:       18px;
    }

    body.theme-blue {
      --accent:       #0ea5e9;
      --accent-glow:  rgba(14, 165, 233, 0.6);
      --accent-glow2: rgba(14, 165, 233, 0.2);
      --accent-light: #7dd3fc;
      --accent-dark:  #0284c7;
      --accent-dim:   rgba(14, 165, 233, 0.15);
      --border-base:  rgba(14, 165, 233, 0.5);
      --text-secondary: rgba(185, 220, 255, 0.7);
      --scan-color:   rgba(14, 165, 233, 0.06);
    }

    body.theme-green {
      --accent:       #22c55e;
      --accent-glow:  rgba(34, 197, 94, 0.6);
      --accent-glow2: rgba(34, 197, 94, 0.2);
      --accent-light: #86efac;
      --accent-dark:  #16a34a;
      --accent-dim:   rgba(34, 197, 94, 0.15);
      --border-base:  rgba(34, 197, 94, 0.5);
      --text-secondary: rgba(185, 255, 210, 0.7);
      --scan-color:   rgba(34, 197, 94, 0.06);
    }

    /* ─── Clip-path shape (cut corners) ────────────────────────────────────────── */
    .cut-corners {
      clip-path: polygon(
        0 0,
        calc(100% - var(--cut-size)) 0,
        100% var(--cut-size),
        100% 100%,
        var(--cut-size) 100%,
        0 calc(100% - var(--cut-size))
      );
    }

    /* ─── Card positioning ─────────────────────────────────────────────────────── */
    .player-anchor {
      position: fixed;
      padding: 20px;
      z-index: 100;
      /* drop-shadow works with clip-path unlike box-shadow */
      filter:
        drop-shadow(0 0 18px var(--accent-glow))
        drop-shadow(0 0 40px var(--accent-glow2))
        drop-shadow(0 12px 40px rgba(0, 0, 0, 0.7));
    }

    .player-anchor.bottom-left  { bottom: 0; left:  0; }
    .player-anchor.bottom-right { bottom: 0; right: 0; }
    .player-anchor.top-left     { top:    0; left:  0; }
    .player-anchor.top-right    { top:    0; right: 0; }

    /* ─── Rotating neon border wrapper ─────────────────────────────────────────── */
    .card-border-wrapper {
      position: relative;
      padding: 1px;
      background: conic-gradient(
        from var(--border-angle),
        var(--accent-dark) 0%,
        var(--accent) 25%,
        var(--accent-light) 50%,
        var(--accent) 75%,
        var(--accent-dark) 100%
      );
      animation: rotate-border 4s linear infinite;
      clip-path: polygon(
        0 0,
        calc(100% - var(--cut-size)) 0,
        100% var(--cut-size),
        100% 100%,
        var(--cut-size) 100%,
        0 calc(100% - var(--cut-size))
      );

      /* Hidden by default */
      opacity: 0;
      transform: translateY(32px);
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-border-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .player-anchor.top-left  .card-border-wrapper,
    .player-anchor.top-right .card-border-wrapper {
      transform: translateY(-32px);
    }
    .player-anchor.top-left  .card-border-wrapper.visible,
    .player-anchor.top-right .card-border-wrapper.visible {
      transform: translateY(0);
    }

    @keyframes rotate-border {
      to { --border-angle: 360deg; }
    }

    /* ─── Now-playing card ─────────────────────────────────────────────────────── */
    .now-playing-card {
      position: relative;
      width: 420px;
      background: var(--card-bg);
      padding: 14px 16px 12px;
      overflow: hidden;
      clip-path: polygon(
        0 0,
        calc(100% - var(--cut-size)) 0,
        100% var(--cut-size),
        100% 100%,
        var(--cut-size) 100%,
        0 calc(100% - var(--cut-size))
      );
    }

    /* ─── Scanline sweep animation ──────────────────────────────────────────────── */
    .now-playing-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        var(--scan-color) 3px,
        var(--scan-color) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .now-playing-card::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -40%;
      height: 40%;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255, 255, 255, 0.025) 50%,
        transparent 100%
      );
      animation: scan-sweep 5s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes scan-sweep {
      0%   { top: -40%; }
      100% { top: 140%; }
    }

    /* All card children above scanlines */
    .card-header,
    .card-body,
    .card-controls,
    .progress-section,
    .queue-badge {
      position: relative;
      z-index: 2;
    }

    /* ─── Top strip: label + equalizer ────────────────────────────────────────── */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .now-playing-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      gap: 7px;
      text-shadow: 0 0 10px var(--accent);
    }

    .now-playing-label .pulse-ring {
      position: relative;
      width: 8px;
      height: 8px;
      flex-shrink: 0;
    }

    .now-playing-label .pulse-ring::before,
    .now-playing-label .pulse-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .now-playing-label .pulse-ring::before {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .now-playing-label .pulse-ring::after {
      border: 1.5px solid var(--accent);
      animation: ring-pulse 2s ease-out infinite;
      opacity: 0;
    }

    @keyframes ring-pulse {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0;   }
    }

    /* ─── Equalizer bars ───────────────────────────────────────────────────────── */
    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }

    .eq-bar {
      width: 3px;
      background: linear-gradient(to top, var(--accent-dark), var(--accent-light));
      border-radius: 2px;
      height: 6px;
      transition: height 0.2s ease;
      box-shadow: 0 0 4px var(--accent);
    }

    .now-playing-card.playing .eq-bar:nth-child(1) { animation: eq1 0.9s  ease-in-out infinite; }
    .now-playing-card.playing .eq-bar:nth-child(2) { animation: eq2 0.7s  ease-in-out infinite 0.10s; }
    .now-playing-card.playing .eq-bar:nth-child(3) { animation: eq3 1.1s  ease-in-out infinite 0.20s; }
    .now-playing-card.playing .eq-bar:nth-child(4) { animation: eq4 0.8s  ease-in-out infinite 0.05s; }
    .now-playing-card.playing .eq-bar:nth-child(5) { animation: eq5 1.0s  ease-in-out infinite 0.15s; }

    @keyframes eq1 { 0%,100%{height:4px}  50%{height:16px} }
    @keyframes eq2 { 0%,100%{height:10px} 50%{height:5px}  }
    @keyframes eq3 { 0%,100%{height:6px}  50%{height:18px} }
    @keyframes eq4 { 0%,100%{height:14px} 50%{height:4px}  }
    @keyframes eq5 { 0%,100%{height:8px}  50%{height:12px} }

    /* ─── Main content row ─────────────────────────────────────────────────────── */
    .card-body {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    /* ─── Thumbnail ────────────────────────────────────────────────────────────── */
    .thumbnail-wrap {
      position: relative;
      flex-shrink: 0;
      width: 74px;
      height: 74px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px var(--border-base),
        0 0 16px var(--accent-glow2),
        0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Shimmer loading */
    .thumbnail-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.07) 50%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .thumbnail-wrap.loading::after { opacity: 1; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    /* ─── Song info ────────────────────────────────────────────────────────────── */
    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      margin-bottom: 3px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }

    .song-channel {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .song-requester {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .song-requester .requester-name {
      color: var(--accent-light);
      font-weight: 600;
      text-shadow: 0 0 8px var(--accent);
    }

    /* ─── Controls row ─────────────────────────────────────────────────────────── */
    .card-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      padding: 8px 0 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border-base);
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-secondary);
      transition:
        color       0.2s ease,
        border-color 0.2s ease,
        background  0.2s ease,
        box-shadow  0.2s ease,
        transform   0.15s ease;
      position: relative;
      outline: none;
    }

    .ctrl-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Skip back/forward – smaller */
    .ctrl-btn.ctrl-skip {
      width: 34px;
      height: 34px;
      padding: 8px;
    }

    /* Play/Pause – larger, primary */
    .ctrl-btn.ctrl-play {
      width: 44px;
      height: 44px;
      padding: 10px;
      border-color: var(--accent);
      color: var(--accent-light);
      background: var(--accent-dim);
      box-shadow: 0 0 12px var(--accent-glow2), inset 0 0 8px var(--accent-glow2);
    }

    .ctrl-btn:hover {
      color: var(--accent-light);
      border-color: var(--accent-light);
      box-shadow: 0 0 14px var(--accent-glow), inset 0 0 6px var(--accent-glow2);
      transform: scale(1.08);
    }

    .ctrl-btn.ctrl-play:hover {
      background: rgba(145, 71, 255, 0.25);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px var(--accent-glow2);
      transform: scale(1.1);
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn:disabled {
      opacity: 0.35;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .ctrl-btn svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Corner accent marks on the controls row */
    .card-controls::before,
    .card-controls::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--border-base) 60%,
        transparent
      );
      opacity: 0.5;
    }

    /* ─── Progress section ─────────────────────────────────────────────────────── */
    .progress-section {
      margin-top: 10px;
    }

    .progress-wrap {
      position: relative;
      background: var(--progress-track);
      border-radius: 4px;
      height: 5px;
      overflow: visible;
      cursor: default;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--accent-light));
      border-radius: 4px;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: width 1s linear;
      position: relative;
    }

    /* Glowing cursor dot at the tip of progress */
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 9px;
      height: 9px;
      background: #fff;
      border-radius: 50%;
      box-shadow:
        0 0 6px var(--accent),
        0 0 14px var(--accent-glow);
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* Show dot when progress is meaningful */
    .progress-fill.active::after { opacity: 1; }

    .progress-times {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
    }

    .progress-times span {
      font-family: 'Orbitron', sans-serif;
      font-size: 8px;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
    }

    /* ─── Queue counter badge ──────────────────────────────────────────────────── */
    .queue-badge {
      position: absolute;
      top: -8px;
      right: 10px;
      background: var(--accent);
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      box-shadow: 0 0 10px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.4);
      display: none;
      clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    }

    .card-border-wrapper.has-queue .queue-badge { display: block; }

    /* ─── Hidden YouTube iframe ────────────────────────────────────────────────── */
    #yt-player-container {
      position: absolute;
      width: 1px;
      height: 1px;
      top: -9999px;
      left: -9999px;
      overflow: hidden;
      pointer-events: none;
    }

    /* ─── Audio unlock button ──────────────────────────────────────────────────── */
    .audio-unlock-button {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 36px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      border: 1px solid var(--border-base);
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 24px var(--accent-glow);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      z-index: 9999;
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    }

    .audio-unlock-button:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 40px var(--accent-glow);
    }

    .audio-unlock-button.hidden { display: none; }

    /* ─── Debug panel ──────────────────────────────────────────────────────────── */
    .debug-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff88;
      padding: 10px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      display: none;
      z-index: 10000;
      min-width: 220px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      line-height: 1.6;
    }

    .debug-panel.visible { display: block; }
    .debug-panel strong  { color: #fff; }
    .debug-panel p       { margin: 2px 0; }
  </style>
</head>
<body>

  <!-- Hidden YouTube player container -->
  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <!-- Audio unlock button (shown on first load in OBS) -->
  <button class="audio-unlock-button hidden" id="audio-unlock-btn">
    &#9654;&nbsp; ENABLE AUDIO
  </button>

  <!-- Debug panel -->
  <div class="debug-panel" id="debug-panel">
    <p><strong>Song Player Debug</strong></p>
    <p>Status: <span id="dbg-status">Initializing…</span></p>
    <p>Connection: <span id="dbg-connection">Disconnected</span></p>
    <p>Queue length: <span id="dbg-queue">0</span></p>
    <p>Current song: <span id="dbg-song">None</span></p>
    <p>YT State: <span id="dbg-yt-state">—</span></p>
    <p>Audio: <span id="dbg-audio">Locked</span></p>
  </div>

  <!-- Player anchor (position set by JS) -->
  <div class="player-anchor bottom-left" id="player-anchor">
    <!-- 1px gradient border wrapper -->
    <div class="card-border-wrapper" id="card-border-wrapper">
      <!-- Queue badge (parallelogram shape) -->
      <div class="queue-badge" id="queue-badge">+1</div>

      <div class="now-playing-card" id="now-playing-card">
        <!-- Header: label + equalizer -->
        <div class="card-header">
          <span class="now-playing-label">
            <span class="pulse-ring"></span>
            Now Playing
          </span>
          <div class="eq-bars" aria-hidden="true">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        </div>

        <!-- Thumbnail + song info -->
        <div class="card-body">
          <div class="thumbnail-wrap loading" id="thumbnail-wrap">
            <img
              class="thumbnail-img"
              id="song-thumbnail"
              src=""
              alt="Song thumbnail"
              crossorigin="anonymous"
            >
          </div>
          <div class="song-info">
            <div class="song-title"   id="song-title">Loading…</div>
            <div class="song-channel" id="song-channel"></div>
            <div class="song-requester">
              Requested by <span class="requester-name" id="song-requester"></span>
            </div>
          </div>
        </div>

        <!-- Playback controls -->
        <div class="card-controls">
          <button class="ctrl-btn ctrl-skip" id="btn-prev" title="Previous / Restart" aria-label="Restart song" disabled>
            <!-- Restart/rewind icon -->
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>

          <button class="ctrl-btn ctrl-play" id="btn-play-pause" title="Play / Pause" aria-label="Play or pause">
            <!-- Play icon (default) -->
            <svg viewBox="0 0 24 24" fill="currentColor" id="icon-play-pause" xmlns="http://www.w3.org/2000/svg">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
          </button>

          <button class="ctrl-btn ctrl-skip" id="btn-skip" title="Skip song" aria-label="Skip current song">
            <!-- Skip forward icon -->
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 18l8.5-6L6 6v12zm8.5-6l1.5 1.06V6H16v12h-1.5V13.06z"/>
            </svg>
          </button>
        </div>

        <!-- Progress bar -->
        <div class="progress-section">
          <div class="progress-wrap">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-times">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
      </div><!-- /.now-playing-card -->
    </div><!-- /.card-border-wrapper -->
  </div><!-- /.player-anchor -->

  <script src="../js/overlay-client.js"></script>
  <script>
    'use strict';

    /* ─── URL parameter parsing ──────────────────────────────────────────────── */
    const urlParams     = new URLSearchParams(window.location.search);
    const debugMode     = urlParams.get('debug') === 'true';
    const positionParam = (urlParams.get('position') || 'bottom-left').toLowerCase();
    const themeParam    = (urlParams.get('theme')    || 'purple').toLowerCase();

    const VALID_POSITIONS = ['bottom-left', 'bottom-right', 'top-left', 'top-right'];
    const VALID_THEMES    = ['purple', 'blue', 'green'];

    const position = VALID_POSITIONS.includes(positionParam) ? positionParam : 'bottom-left';
    const theme    = VALID_THEMES.includes(themeParam)       ? themeParam    : 'purple';

    /* Apply position and theme */
    document.getElementById('player-anchor').className = `player-anchor ${position}`;
    if (theme !== 'purple') document.body.classList.add(`theme-${theme}`);

    /* ─── Debug helpers ──────────────────────────────────────────────────────── */
    if (debugMode) {
      document.getElementById('debug-panel').classList.add('visible');
    }

    function dbg(key, value) {
      if (!debugMode) return;
      const el = document.getElementById(`dbg-${key}`);
      if (el) el.textContent = value;
    }

    function log(...args) {
      if (debugMode) console.log('[SongPlayer]', ...args);
    }

    /* ─── State ──────────────────────────────────────────────────────────────── */
    let localQueue         = [];
    let currentSong        = null;
    let ytPlayer           = null;
    let ytReady            = false;
    let progressTimer      = null;
    let audioUnlocked      = false;
    let pendingPlay        = false;
    let loadingSongId      = null;
    let skipNotifyInFlight = false;
    let isPlayerPaused     = false; // track manual pause state

    /* ─── DOM refs ───────────────────────────────────────────────────────────── */
    const wrapper       = document.getElementById('card-border-wrapper');
    const card          = document.getElementById('now-playing-card');
    const queueBadge    = document.getElementById('queue-badge');
    const thumbWrap     = document.getElementById('thumbnail-wrap');
    const songThumb     = document.getElementById('song-thumbnail');
    const songTitle     = document.getElementById('song-title');
    const songChannel   = document.getElementById('song-channel');
    const songRequester = document.getElementById('song-requester');
    const progressFill  = document.getElementById('progress-fill');
    const timeCurrent   = document.getElementById('time-current');
    const timeTotal     = document.getElementById('time-total');

    /* Control buttons */
    const btnPlayPause  = document.getElementById('btn-play-pause');
    const btnSkip       = document.getElementById('btn-skip');
    const btnPrev       = document.getElementById('btn-prev');
    const iconPlayPause = document.getElementById('icon-play-pause');

    /* ─── Time formatter ─────────────────────────────────────────────────────── */
    function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    /* ─── Play/Pause icon switcher ───────────────────────────────────────────── */
    const SVG_PLAY  = `<polygon points="5,3 19,12 5,21"/>`;
    const SVG_PAUSE = `<rect x="5" y="4" width="4" height="16" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/>`;

    function setPlayIcon(isPlaying) {
      iconPlayPause.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;
      btnPlayPause.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
      btnPlayPause.setAttribute('title', isPlaying ? 'Pause' : 'Play');
    }

    /* ─── Thumbnail helpers ──────────────────────────────────────────────────── */
    function getThumbnailUrl(song) {
      if (song.videoId) {
        return `https://i.ytimg.com/vi/${song.videoId}/hqdefault.jpg`;
      }
      if (song.thumbnail) {
        return song.thumbnail.replace(/\/(default|mqdefault|sddefault)\.jpg/, '/hqdefault.jpg');
      }
      return '';
    }

    function setupThumbnailFallback() {
      songThumb.onerror = function() {
        if (!currentSong) return;
        const current = this.src;
        if (current.includes('hqdefault')) {
          this.src = current.replace('hqdefault', 'mqdefault');
        } else if (current.includes('mqdefault')) {
          this.src = current.replace('mqdefault', 'default');
        }
      };
    }

    /* ─── Card UI updates ────────────────────────────────────────────────────── */
    function updateCardUI(song) {
      songTitle.textContent     = song.title       || 'Unknown Title';
      songChannel.textContent   = song.channelTitle || '';
      songRequester.textContent = song.requesterDisplayName || song.requester || 'Unknown';
      timeTotal.textContent     = song.durationFormatted || '0:00';

      /* Thumbnail */
      thumbWrap.classList.add('loading');
      const thumbUrl = getThumbnailUrl(song);
      if (thumbUrl) {
        songThumb.addEventListener('load', () => thumbWrap.classList.remove('loading'), { once: true });
        songThumb.src = thumbUrl;
      }

      /* Queue badge */
      const queued = localQueue.length - 1;
      if (queued > 0) {
        queueBadge.textContent = `+${queued}`;
        wrapper.classList.add('has-queue');
      } else {
        wrapper.classList.remove('has-queue');
      }

      dbg('song',  song.title ? song.title.substring(0, 30) : '—');
      dbg('queue', localQueue.length);
    }

    function showCard(song) {
      currentSong = song;
      updateCardUI(song);
      wrapper.classList.add('visible', 'playing');
      card.classList.add('playing');
      btnPlayPause.disabled = false;
      btnSkip.disabled      = false;
    }

    function hideCard() {
      wrapper.classList.remove('visible', 'playing', 'has-queue');
      card.classList.remove('playing');
      stopProgressTimer();
      currentSong    = null;
      isPlayerPaused = false;
      progressFill.style.width = '0%';
      progressFill.classList.remove('active');
      timeCurrent.textContent  = '0:00';
      timeTotal.textContent    = '0:00';
      btnPlayPause.disabled    = true;
      btnSkip.disabled         = true;
      btnPrev.disabled         = true;
      setPlayIcon(false);
    }

    /* ─── Progress bar ticker ────────────────────────────────────────────────── */
    function startProgressTimer() {
      stopProgressTimer();
      progressTimer = setInterval(() => {
        if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
        try {
          const cur = ytPlayer.getCurrentTime();
          const dur = ytPlayer.getDuration();
          if (dur > 0) {
            const pct = Math.min((cur / dur) * 100, 100);
            progressFill.style.width      = `${pct}%`;
            progressFill.style.transition = 'width 1s linear';
            progressFill.classList.toggle('active', pct > 0);
            timeCurrent.textContent = formatTime(cur);
            timeTotal.textContent   = formatTime(dur);
          }
        } catch (e) {
          // YT player not ready
        }
      }, 1000);
    }

    function stopProgressTimer() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    /* ─── Control button wiring ──────────────────────────────────────────────── */
    btnPlayPause.addEventListener('click', () => {
      if (!ytPlayer || !ytReady) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
        isPlayerPaused = true;
      } else {
        ytPlayer.playVideo();
        isPlayerPaused = false;
      }
    });

    btnSkip.addEventListener('click', async () => {
      if (!currentSong || btnSkip.disabled) return;
      btnSkip.disabled = true;
      await notifyServerSkip(currentSong ? currentSong.id : null);
      // The WebSocket 'skip' event will re-enable if another song is queued
    });

    btnPrev.addEventListener('click', () => {
      if (!ytPlayer || !ytReady || !currentSong) return;
      // Restart current song from beginning
      try {
        ytPlayer.seekTo(0, true);
        ytPlayer.playVideo();
        isPlayerPaused = false;
      } catch (e) {
        console.warn('[SongPlayer] Seek error:', e);
      }
    });

    /* ─── YouTube IFrame API ─────────────────────────────────────────────────── */
    (function loadYTAPI() {
      const tag   = document.createElement('script');
      tag.src     = 'https://www.youtube.com/iframe_api';
      const first = document.getElementsByTagName('script')[0];
      first.parentNode.insertBefore(tag, first);
    })();

    window.onYouTubeIframeAPIReady = function() {
      log('YouTube IFrame API ready');
      ytPlayer = new YT.Player('yt-player', {
        width:  '1',
        height: '1',
        playerVars: {
          autoplay:       1,
          controls:       0,
          disablekb:      1,
          fs:             0,
          iv_load_policy: 3,
          modestbranding: 1,
          rel:            0,
          showinfo:       0,
          origin:         window.location.origin
        },
        events: {
          onReady:       onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError:       onPlayerError
        }
      });
    };

    function onPlayerReady(event) {
      log('YT player ready');
      ytReady = true;
      dbg('yt-state', 'Ready');

      event.target.unMute();
      event.target.setVolume(100);

      if (pendingPlay && localQueue.length > 0) {
        pendingPlay   = false;
        loadingSongId = null;
        playSong(localQueue[0]);
      }
    }

    const YT_STATE_NAMES = {
      '-1': 'Unstarted',
       '0': 'Ended',
       '1': 'Playing',
       '2': 'Paused',
       '3': 'Buffering',
       '5': 'Cued'
    };

    function onPlayerStateChange(event) {
      const stateCode = event.data;
      dbg('yt-state', YT_STATE_NAMES[String(stateCode)] || String(stateCode));
      log('YT state:', stateCode);

      if (stateCode === YT.PlayerState.PLAYING) {
        card.classList.add('playing');
        wrapper.classList.add('playing');
        btnPrev.disabled = false;
        setPlayIcon(true);
        startProgressTimer();
      } else if (stateCode === YT.PlayerState.PAUSED) {
        card.classList.remove('playing');
        setPlayIcon(false);
        stopProgressTimer();
      } else if (stateCode === YT.PlayerState.BUFFERING) {
        // Keep play icon as playing during buffering
        card.classList.add('playing');
        wrapper.classList.add('playing');
      } else if (stateCode === YT.PlayerState.ENDED) {
        card.classList.remove('playing');
        wrapper.classList.remove('playing');
        setPlayIcon(false);
        stopProgressTimer();
        handleSongEnded();
      }
    }

    function onPlayerError(event) {
      console.warn('[SongPlayer] YT error code:', event.data);
      dbg('yt-state', `Error: ${event.data}`);
      handleSongEnded();
    }

    /* ─── Playback control ───────────────────────────────────────────────────── */
    function playSong(song) {
      if (!song) return;

      if (song.id && song.id === loadingSongId) {
        log('Ignoring duplicate playSong() for already-loading queue entry:', song.id);
        return;
      }

      if (!ytReady) {
        log('YT not ready yet, queuing play for', song.title);
        pendingPlay   = true;
        loadingSongId = song.id;
        showCard(song);
        return;
      }

      log('Playing:', song.title, '(', song.videoId, ')');
      loadingSongId  = song.id;
      isPlayerPaused = false;
      showCard(song);
      setPlayIcon(true);

      try {
        ytPlayer.loadVideoById({ videoId: song.videoId, startSeconds: 0 });
      } catch (e) {
        console.error('[SongPlayer] loadVideoById failed:', e);
        loadingSongId = null;
        handleSongEnded();
      }
    }

    async function notifyServerSkip(songId) {
      if (skipNotifyInFlight) {
        log('Skip notify already in flight, skipping duplicate call');
        return;
      }
      skipNotifyInFlight = true;
      dbg('status', 'Syncing skip to server…');

      const body    = JSON.stringify(songId ? { songId } : {});
      let   attempt = 0;

      while (attempt < 2) {
        attempt++;
        try {
          const res = await fetch('/api/song-queue/skip', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body
          });
          if (res.ok) {
            const json = await res.json();
            if (json.success === false && json.error === 'Song already skipped.') {
              log('Server: song was already skipped by another instance');
            } else {
              log('Server skip confirmed');
              dbg('status', 'Playing');
            }
            break;
          }
          console.warn(`[SongPlayer] skip API returned ${res.status} (attempt ${attempt})`);
        } catch (err) {
          console.warn(`[SongPlayer] skip API error (attempt ${attempt}):`, err);
        }
        if (attempt < 2) await new Promise(r => setTimeout(r, 1500));
      }

      skipNotifyInFlight = false;
    }

    function handleSongEnded() {
      log('Song ended, shifting local queue');

      const endedSong = localQueue.length > 0 ? localQueue[0] : null;

      if (localQueue.length > 0) localQueue.shift();
      loadingSongId = null;

      notifyServerSkip(endedSong ? endedSong.id : null);

      if (localQueue.length > 0) {
        playSong(localQueue[0]);
      } else {
        hideCard();
        if (ytPlayer && ytReady) ytPlayer.stopVideo();
        dbg('status', 'Queue empty – waiting');
        dbg('yt-state', 'Stopped');
      }
    }

    /* ─── Queue state management ─────────────────────────────────────────────── */
    function handleQueueUpdate(data) {
      const { action, active } = data;

      log('Queue update:', action, '| active songs:', active ? active.length : '?');

      localQueue = active ? [...active] : [];
      dbg('queue', localQueue.length);

      switch (action) {
        case 'add':
          if (!currentSong && localQueue.length > 0) {
            playSong(localQueue[0]);
          } else if (currentSong) {
            updateCardUI(currentSong);
          }
          break;

        case 'skip':
          if (localQueue.length > 0) {
            playSong(localQueue[0]);
          } else {
            hideCard();
            if (ytPlayer && ytReady) ytPlayer.stopVideo();
          }
          // Re-enable skip button for next song
          btnSkip.disabled = localQueue.length === 0;
          break;

        case 'remove':
          if (currentSong && data.removedSong && data.removedSong.id === currentSong.id) {
            loadingSongId = null;
            if (localQueue.length > 0) {
              playSong(localQueue[0]);
            } else {
              hideCard();
              if (ytPlayer && ytReady) ytPlayer.stopVideo();
            }
          } else if (currentSong) {
            updateCardUI(currentSong);
          }
          break;

        case 'clear':
          localQueue    = [];
          loadingSongId = null;
          hideCard();
          if (ytPlayer && ytReady) ytPlayer.stopVideo();
          dbg('status', 'Queue cleared');
          break;

        default:
          log('Unknown action:', action);
      }
    }

    /* ─── Initial state fetch ────────────────────────────────────────────────── */
    async function fetchInitialQueue() {
      try {
        const res  = await fetch('/api/song-queue');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const body  = await res.json();
        const queue = body.active || (Array.isArray(body) ? body : []);

        log('Initial queue fetched:', queue.length, 'songs');
        localQueue = [...queue];
        dbg('queue', localQueue.length);

        if (localQueue.length > 0) {
          playSong(localQueue[0]);
          dbg('status', 'Resuming queue from server state');
        } else {
          dbg('status', 'Queue empty – waiting for songs');
        }
      } catch (err) {
        console.warn('[SongPlayer] Failed to fetch initial queue:', err);
        dbg('status', 'Failed to fetch queue');
      }
    }

    /* ─── WebSocket ──────────────────────────────────────────────────────────── */
    const client = new OverlayClient();

    client.on('connected', () => {
      log('WebSocket connected');
      dbg('connection', 'Connected ✓');
      dbg('status',     'Connected – listening');
      fetchInitialQueue();
    });

    client.on('disconnected', () => {
      log('WebSocket disconnected');
      dbg('connection', 'Reconnecting…');
    });

    client.on('song-queue-update', (data) => {
      log('Received song-queue-update:', data);
      handleQueueUpdate(data);
    });

    /* ─── Audio unlock (OBS Chromium autoplay policy) ────────────────────────── */
    const unlockBtn = document.getElementById('audio-unlock-btn');

    function unlockAudio() {
      if (audioUnlocked) return;

      try {
        if (ytPlayer && ytReady) {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
          const state = ytPlayer.getPlayerState();
          if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
            ytPlayer.playVideo();
          }
        }

        audioUnlocked = true;
        dbg('audio', 'Unlocked ✓');
        log('Audio unlocked via user interaction');

        if (unlockBtn) unlockBtn.classList.add('hidden');
      } catch (e) {
        console.warn('[SongPlayer] Audio unlock error:', e);
      }
    }

    if (unlockBtn) {
      const isOBS = typeof window.obsstudio !== 'undefined';

      setTimeout(() => {
        unlockBtn.classList.remove('hidden');

        if (isOBS) {
          setTimeout(() => {
            if (!audioUnlocked) {
              unlockBtn.classList.add('hidden');
              unlockAudio();
            }
          }, 5000);
        }
      }, 600);

      unlockBtn.addEventListener('click', unlockAudio);
    }

    document.addEventListener('click',      unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    /* ─── Init ───────────────────────────────────────────────────────────────── */
    setupThumbnailFallback();
    dbg('status', 'Initialized');

    /* Buttons start disabled until a song loads */
    btnPlayPause.disabled = true;
    btnSkip.disabled      = true;
    btnPrev.disabled      = true;

    fetchInitialQueue();

    /* ─── Debug helpers exposed to console ──────────────────────────────────── */
    if (debugMode) {
      window.testSong = function(overrides = {}) {
        const song = {
          id:                   'test-001',
          videoId:              'dQw4w9WgXcQ',
          title:                'Never Gonna Give You Up',
          channelTitle:         'Rick Astley',
          durationSeconds:      213,
          durationFormatted:    '3:33',
          requester:            'testuser',
          requesterDisplayName: 'TestUser',
          ...overrides
        };
        localQueue = [song];
        playSong(song);
      };

      console.log('[SongPlayer] Debug mode active. Use testSong() to preview the card.');
    }
  </script>
</body>
</html>
