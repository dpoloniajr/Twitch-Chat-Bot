<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loyalty Leaderboard - OBS Overlay</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    :root {
      --lb-bg: rgba(0, 0, 0, 0.75);
      --lb-header-bg: rgba(145, 70, 255, 0.8);
      --lb-text: #ffffff;
      --lb-subtext: #aaaaaa;
      --lb-gold: #ffd700;
      --lb-silver: #c0c0c0;
      --lb-bronze: #cd7f32;
      --lb-accent: #9146ff;
      --lb-row-hover: rgba(145, 70, 255, 0.2);
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: transparent;
    }

    .leaderboard {
      width: 320px;
      background: var(--lb-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .leaderboard-header {
      background: var(--lb-header-bg);
      padding: 15px 20px;
      text-align: center;
    }

    .leaderboard-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--lb-text);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .leaderboard-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 5px;
    }

    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.3s ease;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .leaderboard-item:hover {
      background: var(--lb-row-hover);
    }

    .leaderboard-rank {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: var(--lb-text);
      margin-right: 15px;
    }

    .leaderboard-item:nth-child(1) .leaderboard-rank {
      color: var(--lb-gold);
      font-size: 18px;
    }

    .leaderboard-item:nth-child(2) .leaderboard-rank {
      color: var(--lb-silver);
      font-size: 16px;
    }

    .leaderboard-item:nth-child(3) .leaderboard-rank {
      color: var(--lb-bronze);
    }

    .leaderboard-user {
      flex: 1;
      min-width: 0;
    }

    .leaderboard-username {
      font-size: 16px;
      font-weight: 600;
      color: var(--lb-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leaderboard-level {
      font-size: 11px;
      color: var(--lb-subtext);
      margin-top: 2px;
    }

    .leaderboard-points {
      text-align: right;
      min-width: 80px;
    }

    .leaderboard-points-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--lb-accent);
    }

    .leaderboard-points-label {
      font-size: 10px;
      color: var(--lb-subtext);
      text-transform: uppercase;
    }

    /* Animation for new entries */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .leaderboard-item.new {
      animation: slideIn 0.5s ease;
    }

    /* Rank change indicators */
    .rank-change {
      font-size: 10px;
      margin-left: 5px;
    }

    .rank-up {
      color: #00ff00;
    }

    .rank-down {
      color: #ff4444;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--lb-subtext);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px;
      color: var(--lb-subtext);
    }
  </style>
</head>
<body>
  <div class="leaderboard">
    <div class="leaderboard-header">
      <h2 class="leaderboard-title">Top Chatters</h2>
      <div class="leaderboard-subtitle" id="update-time">Loading...</div>
    </div>
    <ul class="leaderboard-list" id="leaderboard-list">
      <li class="loading">Loading leaderboard...</li>
    </ul>
  </div>

  <script src="../js/overlay-client.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
