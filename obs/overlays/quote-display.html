<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Display - OBS Overlay</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    :root {
      --quote-bg: rgba(0, 0, 0, 0.75);
      --quote-text: #ffffff;
      --quote-author: #9146ff;
      --quote-meta: #888888;
      --quote-mark: rgba(145, 70, 255, 0.5);
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: transparent;
    }

    .quote-container {
      max-width: 500px;
      background: var(--quote-bg);
      border-radius: 12px;
      padding: 30px 40px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .quote-mark {
      position: absolute;
      font-size: 80px;
      color: var(--quote-mark);
      font-family: Georgia, serif;
      line-height: 1;
    }

    .quote-mark.open {
      top: 10px;
      left: 15px;
    }

    .quote-mark.close {
      bottom: 10px;
      right: 15px;
    }

    .quote-text {
      font-size: 24px;
      color: var(--quote-text);
      line-height: 1.4;
      font-style: italic;
      margin: 20px 0;
      position: relative;
      z-index: 1;
    }

    .quote-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .quote-author {
      font-size: 16px;
      color: var(--quote-author);
      font-weight: 600;
    }

    .quote-meta {
      font-size: 12px;
      color: var(--quote-meta);
    }

    .quote-id {
      color: var(--quote-author);
      font-weight: bold;
    }

    .quote-game {
      display: inline-block;
      background: rgba(145, 70, 255, 0.2);
      color: var(--quote-author);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 10px;
    }

    /* Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    .quote-container.show {
      animation: fadeIn 0.5s ease forwards;
    }

    .quote-container.hide {
      animation: fadeOut 0.5s ease forwards;
    }

    /* Hidden state */
    .hidden {
      display: none;
    }

    /* Compact mode */
    .quote-container.compact {
      padding: 20px 25px;
    }

    .quote-container.compact .quote-text {
      font-size: 18px;
    }

    .quote-container.compact .quote-mark {
      font-size: 50px;
    }

    /* Minimal mode */
    .quote-container.minimal {
      background: transparent;
      padding: 10px;
      box-shadow: none;
    }

    .quote-container.minimal .quote-mark {
      display: none;
    }

    .quote-container.minimal .quote-text {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .quote-container.minimal .quote-footer {
      border-top: none;
    }
  </style>
</head>
<body>
  <div class="quote-container hidden" id="quote-container">
    <span class="quote-mark open">"</span>
    <div class="quote-text" id="quote-text">Loading...</div>
    <span class="quote-mark close">"</span>
    <div class="quote-footer">
      <div>
        <span class="quote-author" id="quote-author"></span>
        <span class="quote-game" id="quote-game"></span>
      </div>
      <div class="quote-meta">
        <span class="quote-id" id="quote-id">#0</span>
        <span id="quote-date"></span>
      </div>
    </div>
  </div>

  <script src="../js/overlay-client.js"></script>
  <script src="quote-display.js"></script>
</body>
</html>
