<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Display</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .tts-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 90%;
      width: 800px;
      padding: 20px 30px;
      background: linear-gradient(135deg, rgba(145, 71, 255, 0.95) 0%, rgba(114, 9, 183, 0.95) 100%);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateX(-50%) translateY(100px);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
    }

    .tts-container.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .tts-user {
      font-size: 18px;
      font-weight: bold;
      color: #FFD700;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tts-icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>') center / contain no-repeat;
    }

    .tts-text {
      font-size: 22px;
      color: #ffffff;
      line-height: 1.6;
      word-wrap: break-word;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
    }

    .tts-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      width: 0%;
      border-radius: 0 0 12px 12px;
      transition: width linear;
    }

    /* Debug panel */
    .debug-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      display: none;
      z-index: 10000;
    }

    .debug-panel.visible {
      display: block;
    }

    .debug-panel p {
      margin: 4px 0;
    }

    /* Animation variants */
    .tts-container.slide-up {
      animation: slideUpBounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes slideUpBounce {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(100px);
      }
      60% {
        opacity: 1;
        transform: translateX(-50%) translateY(-10px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: translateX(-50%) scale(1);
      }
      50% {
        transform: translateX(-50%) scale(1.02);
      }
    }

    .tts-container.speaking {
      animation: pulse 2s ease-in-out infinite;
    }

    /* Audio unlock button */
    .audio-unlock-button {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      background: linear-gradient(135deg, #9147ff 0%, #7209b7 100%);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      z-index: 9999;
    }

    .audio-unlock-button:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 12px 40px rgba(145, 71, 255, 0.6);
    }

    .audio-unlock-button.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Audio unlock button (shown on first load) -->
  <button class="audio-unlock-button hidden" id="audio-unlock-button">
    🔊 Click to Enable TTS Audio
  </button>

  <!-- Debug panel -->
  <div class="debug-panel" id="debug-panel">
    <p><strong>TTS Overlay Debug</strong></p>
    <p>Status: <span id="debug-status">Initializing...</span></p>
    <p>Connection: <span id="debug-connection">Disconnected</span></p>
    <p>Last TTS: <span id="debug-last-tts">None</span></p>
    <p>Available Voices: <span id="debug-voices-count">Loading...</span></p>
    <p>Selected Voice: <span id="debug-voice">Loading...</span></p>
    <p>Audio: <span id="debug-audio">Locked</span></p>
  </div>

  <!-- TTS display container -->
  <div class="tts-container" id="tts-container">
    <div class="tts-user" id="tts-user">
      <span class="tts-icon"></span>
      <span id="tts-username">User</span>
    </div>
    <div class="tts-text" id="tts-text">Message text will appear here</div>
    <div class="tts-progress" id="tts-progress"></div>
  </div>

  <!-- Audio element for API-generated TTS -->
  <audio id="tts-audio" preload="none"></audio>

  <script src="../js/overlay-client.js"></script>
  <script src="tts-display.js"></script>
</body>
</html>
