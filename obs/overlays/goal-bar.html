<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Bar Overlay - OBS</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    .goal-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
    }

    .goal-bar-wrapper {
      background: rgba(30, 30, 30, 0.95);
      border: 2px solid #9147ff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(145, 71, 255, 0.2);
    }

    .goal-title {
      color: #fff;
      font-size: 18px;
      margin-bottom: 12px;
      text-align: center;
      font-weight: bold;
    }

    .goal-bar {
      height: 40px;
      background: rgba(60, 60, 60, 0.8);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    .goal-progress {
      height: 100%;
      background: linear-gradient(90deg, #9147ff 0%, #bf94ff 100%);
      border-radius: 20px;
      transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .goal-progress.goal-follow {
      background: linear-gradient(90deg, #00ff7f 0%, #00cc66 100%);
    }

    .goal-progress.goal-subscriber {
      background: linear-gradient(90deg, #ff6b9d 0%, #ff1493 100%);
    }

    .goal-text {
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .goal-percentage {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .goal-stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
    }

    .goal-stat {
      flex: 1;
      text-align: center;
    }

    .goal-stat-label {
      color: #666;
      font-size: 10px;
      text-transform: uppercase;
    }

    .goal-stat-value {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="goal-container">
    <div class="goal-bar-wrapper">
      <div class="goal-title" id="goal-title">Follower Goal</div>
      <div class="goal-bar">
        <div class="goal-progress" id="goal-progress" style="width: 0%">
          <span class="goal-text" id="goal-text">0 / 100</span>
        </div>
        <span class="goal-percentage" id="goal-percentage">0%</span>
      </div>
      <div class="goal-stats">
        <div class="goal-stat">
          <div class="goal-stat-label">Current</div>
          <div class="goal-stat-value" id="goal-current">0</div>
        </div>
        <div class="goal-stat">
          <div class="goal-stat-label">Goal</div>
          <div class="goal-stat-value" id="goal-target">100</div>
        </div>
        <div class="goal-stat">
          <div class="goal-stat-label">Remaining</div>
          <div class="goal-stat-value" id="goal-remaining">100</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/overlay-client.js"></script>
  <script src="goal-bar.js"></script>
</body>
</html>
