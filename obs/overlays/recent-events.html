<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recent Events Overlay - OBS</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    #events-list {
      max-height: 100%;
      overflow-y: auto;
    }

    /* Scrollbar styling */
    #events-list::-webkit-scrollbar {
      width: 6px;
    }

    #events-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }

    #events-list::-webkit-scrollbar-thumb {
      background: #9147ff;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div class="recent-events-container">
      <div id="events-list"></div>
    </div>
  </div>

  <script src="../js/overlay-client.js"></script>
  <script src="recent-events.js"></script>
</body>
</html>
