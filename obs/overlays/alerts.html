<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Alerts Overlay</title>
  <link rel="stylesheet" href="../css/overlay-base.css">
  <style>
    /* Enhanced Alert Styles */
    .overlay-container {
      perspective: 1000px;
    }

    .alert-wrapper {
      display: none;
      position: relative;
      text-align: center;
    }

    .alert-wrapper.visible {
      display: block;
    }

    .alert-media {
      max-width: 100%;
      max-height: 300px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .alert-video {
      max-width: 100%;
      max-height: 300px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .alert-box {
      display: inline-block;
      min-width: 300px;
      max-width: 600px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .alert-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .alert-type-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #888;
      margin-bottom: 8px;
    }

    .alert-username {
      transition: color 0.3s ease;
    }

    .alert-amount {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
    }

    .alert-user-message {
      font-style: italic;
      color: #aaa;
      margin-top: 15px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .alert-tier {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .tier-prime {
      background: linear-gradient(135deg, #5a4fbd, #8b7dd8);
      color: white;
    }

    .tier-1 {
      background: linear-gradient(135deg, #ff6b9d, #ff9ec4);
      color: white;
    }

    .tier-2 {
      background: linear-gradient(135deg, #9147ff, #bf94ff);
      color: white;
    }

    .tier-3 {
      background: linear-gradient(135deg, #00d4ff, #00ffff);
      color: #000;
    }

    /* Debug panel (hidden by default) */
    .debug-panel {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      font-family: monospace;
      font-size: 10px;
      padding: 10px;
      border-radius: 4px;
      max-width: 300px;
      display: none;
      z-index: 1000;
    }

    .debug-panel.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div id="alertWrapper" class="alert-wrapper">
      <!-- Media container (image or video) -->
      <div id="mediaContainer"></div>

      <!-- Alert content box -->
      <div id="alertBox" class="alert-box">
        <div id="alertIcon" class="alert-icon"></div>
        <div id="alertTypeLabel" class="alert-type-label"></div>
        <div id="alertUsername" class="alert-username"></div>
        <div id="alertAmount" class="alert-amount" style="display:none;"></div>
        <div id="alertMessage" class="alert-message"></div>
        <div id="alertDetails" class="alert-details"></div>
        <div id="alertTier" class="alert-tier" style="display:none;"></div>
        <div id="alertUserMessage" class="alert-user-message" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div id="debugPanel" class="debug-panel">
    <div>Status: <span id="debugStatus">Connecting...</span></div>
    <div>Queue: <span id="debugQueue">0</span></div>
    <div>Last Alert: <span id="debugLastAlert">None</span></div>
  </div>

  <script src="../js/overlay-client.js"></script>
  <script src="alerts.js"></script>
</body>
</html>
